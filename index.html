<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Памятка Банки 3.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&subset=cyrillic&display=swap">
<style>
:root{--bg:#f3f4f8;--sf:#fff;--tx:#29303e;--mu:#6b7285;--bb:#951b81;--bl:#f5e9f3;--bm:#e0c6db;--fu:#c7017f;--fl:#fde6f2;--ln:#e3e5ed;--thb:#951b81;--gr:linear-gradient(120deg,#831f82,#c7017f 60%,#e30613);--sh:0 2px 10px rgba(41,48,62,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c212b;--sf:#272d3a;--tx:#eceef4;--mu:#a3a9bb;--bb:#e08fd2;--bl:#3a2c3b;--bm:#5a4358;--fu:#f06bb4;--fl:#47263c;--ln:#363d4d;--thb:#7a1a6c;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c212b;--sf:#272d3a;--tx:#eceef4;--mu:#a3a9bb;--bb:#e08fd2;--bl:#3a2c3b;--bm:#5a4358;--fu:#f06bb4;--fl:#47263c;--ln:#363d4d;--thb:#7a1a6c;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--fu)}mark{background:var(--fl);color:var(--fu);border-radius:3px;padding:0 2px;font-weight:600}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{display:flex;gap:8px;align-items:center;max-width:1200px;margin:auto;padding:10px 14px}
.logo{font-weight:700;color:var(--tx);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:10px;font-size:14px}.brand{max-width:1200px;margin:auto;padding:16px 14px 6px}.brand img{height:30px;width:auto;display:block}.logo i{color:var(--fu);font-style:normal}
.sr{flex:1;position:relative}.sr input{width:100%;padding:10px 36px 10px 14px;border:1.5px solid var(--bm);border-radius:14px;background:var(--sf);color:var(--tx);font-family:inherit;font-size:inherit;outline:0}
.sr input:focus{border-color:var(--fu)}.sr label{display:block;font-size:12px;font-weight:700;color:var(--bb);margin:0 0 3px 6px;text-transform:uppercase;letter-spacing:.04em}.bar2{max-width:1200px;margin:auto;padding:0 14px 10px}.sr button{position:absolute;right:6px;bottom:6px;border:0;background:var(--bl);color:var(--bb);width:26px;height:26px;border-radius:50%;cursor:pointer;display:none}
.btn{border:1.5px solid var(--bm);background:var(--sf);color:var(--bb);border-radius:14px;padding:9px 12px;font-family:inherit;font-size:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn b{background:var(--fu);color:#fff;border-radius:10px;padding:0 7px;margin-left:4px;font-size:12px}.btn.on{background:var(--bl)}
.panel{max-width:1200px;margin:auto;padding:0 14px 12px}.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bm);background:var(--sf);color:var(--tx);border-radius:20px;padding:4px 11px;font-family:inherit;font-size:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--bb);color:#fff;border-color:var(--bb)}.lnk{background:none;border:0;color:var(--fu);font-family:inherit;font-size:inherit;cursor:pointer;padding:8px 0 0;font-weight:600}
main{max-width:1200px;margin:auto;padding:16px 14px 60px}
.hero{background:var(--gr);color:#fff;border-radius:22px;padding:22px;margin-bottom:18px}
.hero h1{margin:0 0 6px;font-size:24px;color:#fff}.hero p{margin:0;color:rgba(255,255,255,.9)}.st{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.st span{background:rgba(255,255,255,.95);color:#29303e;border-radius:12px;padding:6px 12px;font-size:13px;color:var(--mu)}.st b{color:var(--fu);font-size:16px}
.grp{margin:22px 0 10px}.grp h2{margin:0;font-size:17px;color:var(--bb)}.grp p{margin:0;color:var(--mu);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{display:block;text-decoration:none;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--bb);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.g1 .tile,.g3 .tile{border-left-color:var(--fu)}.tile:hover{border-color:var(--fu)}.tile b{display:block}.tile small{color:var(--mu);display:block}.tile em{font-style:normal;color:var(--fu);font-size:12px;font-weight:600}
.back{display:inline-block;margin-bottom:10px;color:var(--bb);font-weight:600;text-decoration:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}.tabs a{white-space:nowrap;padding:5px 12px;border-radius:18px;background:var(--sf);border:1px solid var(--ln);color:var(--tx);text-decoration:none;font-size:13px}
.tabs a.on{background:var(--fu);color:#fff;border-color:var(--fu)}
h2.sh{margin:6px 0 2px;color:var(--bb);font-size:21px}.sub{color:var(--mu);margin:0 0 10px}
.info{background:var(--bl);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:16px;color:var(--bb);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card h3 small{background:var(--fl);color:var(--fu);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600}
dl{margin:0;display:grid;gap:7px}dl div{border-top:1px dashed var(--ln);padding-top:6px}dt{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.02em}dd{margin:0;overflow-wrap:anywhere}
dl.more{margin-top:10px;border-top:2px solid var(--bm);padding-top:8px}
.pill{border-radius:10px;padding:1px 10px;font-weight:600;font-size:13px;background:var(--bl);color:var(--bb)}.pill.n{background:var(--ln);color:var(--mu)}.pill.s{background:var(--fu);color:#fff}
.note{background:var(--sf);border:1px solid var(--bm);border-left:4px solid var(--fu);border-radius:12px;padding:10px 14px;margin:0 0 12px;grid-column:1/-1}.note.h{font-weight:700;color:var(--bb);background:var(--bl);border-color:var(--bl)}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px;max-height:75vh}
table{border-collapse:separate;border-spacing:0;font-size:14px;line-height:1.45;width:max-content;min-width:100%}tbody tr:nth-child(even) td{background:var(--bg)}tbody tr:hover td{background:var(--bl)}td.c{text-align:center}
th,td{border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);padding:10px 12px;vertical-align:top;min-width:96px;max-width:320px}th{font-size:12.5px;line-height:1.3}
th{position:sticky;top:0;background:var(--thb);color:#fff;z-index:2;text-align:left}td:first-child,th:first-child{position:sticky;left:0;background:var(--sf);z-index:1;font-weight:600;min-width:120px;max-width:200px;box-shadow:2px 0 4px rgba(41,48,62,.06)}tbody tr:nth-child(even) td:first-child{background:var(--bg)}th:first-child{background:var(--thb);color:#fff;z-index:3}
tr.sub td{background:var(--fl);color:var(--fu);font-weight:700}td.x{color:var(--bm);text-align:center}td.span{max-width:none;white-space:normal;background:var(--bg)}
.res{margin-bottom:26px}.res>h2{font-size:17px;margin:0 0 8px;color:var(--bb);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.res>h2 a{font-size:13px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.ctc{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.ctc div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 12px}.ctc small{color:var(--mu);display:block}
details{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;margin-top:24px}summary{cursor:pointer;font-weight:600;color:var(--fu)}details li{margin:6px 0}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:6px 0 8px}
.bg{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;min-height:140px;padding:20px 18px;border-radius:14px;border:0;background:var(--thb);color:#fff;font-family:inherit;font-size:inherit;cursor:pointer;box-shadow:var(--sh);transition:.2s}
.bg:hover{background:var(--gr);transform:translateY(-2px)}.bg b{font-size:18px;line-height:1.2}.bg small{color:rgba(255,255,255,.85);font-size:12.5px;max-width:190px}.bg em{font-style:normal;background:rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:1px 12px;font-size:13px;font-weight:700}
button.lk{margin:30px 0 0;padding:6px 0;border:0;background:none;font-family:inherit;font-size:20px;font-weight:700;color:var(--bb);cursor:pointer;text-decoration:underline;text-decoration-color:var(--fu);text-underline-offset:6px}button.lk span{color:var(--fu)}
#md{position:fixed;inset:0;z-index:30;background:rgba(46,39,71,.45);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}#md.on{display:flex}
#md .box{background:var(--bg);border-radius:28px;max-width:820px;width:100%;max-height:100%;overflow:auto;padding:22px;box-shadow:0 10px 40px rgba(46,39,71,.3);position:relative}
#md h2{margin:0 36px 2px 0;color:var(--bb);font-size:22px}#md .sub{margin:0 0 14px}#md .x{position:absolute;right:14px;top:14px;border:0;background:var(--bl);color:var(--bb);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
footer{color:var(--mu);font-size:12px;margin-top:22px}
@media (max-width:600px){.hero h1{font-size:20px}.logo span{display:none}}
</style></head><body>

ерждение дохода","Зп клиент – подтверждение дохода не требуется\nЗп клиент другого Банка: справка 2-НДФЛ или по форме Банка на текущем месте работы за последние 12 месяцев. Если стаж работы составляет менее 12 месяцев, справка предоставляется за фактическое количество отработанных месяцев, но не менее 3-х мес. \nИндивидуальный предприниматель: подтвердить доход и занятость выпиской из СФР, загруженной с помощью технологии запроса выписки из СФР Онлайн (кнопка «Госуслуги») ЛИБО  из личного кабинета на сайте Госуслуг, в формате xml. Если ИП подтверждает доход с помощью налоговой декларации, то занятость можно подтвердить  выпиской ЕГРИП в формате PDF-файла, скачав ее с государственного сервиса egrul.nalog.ru.\nСамозанятый: подтвердить доход справкой о состоянии расчётов (доходов) по налогу на профессиональный доход по форме ФНС России (КНД 1122036).\nБез подтверждения дохода: паспорт РФ и второй документ на выбор - водительское удостоверение, СНИЛС, удостоверение личности военнослужащего, удостоверение личности сотрудника федеральных органов власти, военный билет, загранпаспорт."],["Подтверждение занятости","Подтвердить трудовую занятость можно, предоставив:\n1.        копию трудовой книжки, заверенную работодателем;\n2.        выписку из трудовой книжки, заверенную работодателем;\n3.        выписку из электронной трудовой книжки;\n4.        справку от работодателя, содержащую сведения о занимаемой должности и стаже работы (сроке службы), или копию договора/контракта с последнего места работы (для физических лиц, в отношении которых законодательством РФ допускается отсутствие трудовой книжки);\n5.        форму СТД-Р и СТД-ПФР только на бумажном носителе (должна соответствовать приказу правительства)."],["Оформление собственности","Если в КД один, то и в ДДУ один.\nМожно , чтобы в КД были двое, а ДДУ оформить только на основного"],["доп доход (аренда, пенсия и тд)","3 НДФЛ \n\nПринимают в учет только те, которые официально декларируют"],["Рассрочка - ипотека\n(изменение участников сделки)","Состав взрослых участником менять не можем\nмы можем в допник при переходе с рассрочки на ипотеку, включать только несовершеннолетних в возрасте  до 18 лет, если их не было в ДДУ и возникла потребность их включить."],["Срок действия одобренного решения","3 мес"],["Военный билет","Не запрашивают"],["Сотрудник МВД (по 2-ндфл)","Да"],["Муж/жена банкрот","Сбер откажет"],["Рефинансирование","Пока нет рефа со стандарта на СИ"],["КУДИР","нет"],["Паспорт. Все страницы?","02.03.2026"],["Сертификаты/займы","У нас нет конкретного списка сертификатов, которые мы берём в подтверждение пв \nМы берём все безвозмездные выплаты. \nЗаймы не берём. \n\nОднако, есть сертификаты, которыми по решению уполномоченного органа можно только гасить ипотеку, несмотря на то, что нет займа. \nЛучше дополнительно проконсультироваться в органе, выдавшем сертификат"],["","Переход с рассрочки на ипотеку, где нужно, чтобы в ДДУ остался один заемщик: \nМожно в банках: ВТБ, Дом рф, Металл, Абсолют.\nНельзя: Альфа, Уралсиб"]],"more":[],"s":"сбербанк подтверждение дохода зп клиент – подтверждение дохода не требуется\nзп клиент другого банка: справка 2-ндфл или по форме банка на текущем месте работы за последние 12 месяцев. если стаж работы составляет менее 12 месяцев, справка предоставляется за фактическое количество отработанных месяцев, но не менее 3-х мес. \nиндивидуальный предприниматель: подтвердить доход и занятость выпиской из сфр, загруженной с помощью технологии запроса выписки из сфр онлайн (кнопка «госуслуги») либо  из личного кабинета на сайте госуслуг, в формате xml. если ип подтверждает доход с помощью налоговой декларации, то занятость можно подтвердить  выпиской егрип в формате pdf-файла, скачав ее с государственного сервиса egrul.nalog.ru.\nсамозанятый: подтвердить доход справкой о состоянии расчетов (доходов) по налогу на профессиональный доход по форме фнс россии (кнд 1122036).\nбез подтверждения дохода: паспорт рф и второй документ на выбор - водительское удостоверение, снилс, удостоверение личности военнослужащего, удостоверение личности сотрудника федеральных органов власти, военный билет, загранпаспорт. подтверждение занятости подтвердить трудовую занятость можно, предоставив:\n1.        копию трудовой книжки, заверенную работодателем;\n2.        выписку из трудовой книжки, заверенную работодателем;\n3.        выписку из электронной трудовой книжки;\n4.        справку от работодателя, содержащую сведения о занимаемой должности и стаже работы (сроке службы), или копию договора/контракта с последнего места работы (для физических лиц, в отношении которых законодательством рф допускается отсутствие трудовой книжки);\n5.        форму стд-р и стд-пфр только на бумажном носителе (должна соответствовать приказу правительства). оформление собственности если в кд один, то и в дду один.\nможно , чтобы в кд были двое, а дду оформить только на основного доп доход (аренда, пенсия и тд) 3 ндфл \n\nпринимают в учет только те, которые официально декларируют рассрочка - ипотека\n(изменение участников сделки) состав взрослых участником менять не можем\nмы можем в допник при переходе с рассрочки на ипотеку, включать только несовершеннолетних в возрасте  до 18 лет, если их не было в дду и возникла потребность их включить. срок действия одобренного решения 3 мес военный билет не запрашивают сотрудник мвд (по 2-ндфл) да муж/жена банкрот сбер откажет рефинансирование пока нет рефа со стандарта на си кудир нет паспорт. все страницы? 02.03.2026 сертификаты/займы у нас нет конкретного списка сертификатов, которые мы берем в подтверждение пв \nмы берем все безвозмездные выплаты. \nзаймы не берем. \n\nоднако, есть сертификаты, которыми по решению уполномоченного органа можно только гасить ипотеку, несмотря на то, что нет займа. \nлучше дополнительно проконсультироваться в органе, выдавшем сертификат  переход с рассрочки на ипотеку, где нужно, чтобы в дду остался один заемщик: \nможно в банках: втб, дом рф, металл, абсолют.\nнельзя: альфа, уралсиб"},{"t":"card","n":"ВТБ","b":["vtb"],"g":"","kv":[["Подтверждение дохода","Зп клиент - только паспорт\nЗп клиент другого Банка:\n- для подтверждения дохода — справка о доходах (2-НДФЛ), выписка с зарплатного счета или справка по форме банка;\n- чтобы подтвердить свою занятость — копию трудовой книжки, заверенную работодателем, или выписку из Пенсионного фонда.\nБез подтверждения дохода - паспорт и СНИЛС/ИНН\nДля ИП один из документов:\n- Копия налоговой декларации по налогу на доходы физических лиц минимум за 1 год (форма 3-НДФЛ)\n- Копия налоговой декларации по налогу, уплачиваемому в связи с применением упрощенной системы налогообложения минимум за 1 год\nАдвокаты, нотариусы один из документов:\n- Копия налоговой декларации по налогу на доходы физических лиц минимум за 1 год (форма 3-НДФЛ)\n- Копия налоговой декларации по налогу, уплачиваемому в связи с применением упрощенной системы налогообложения минимум за 1 год\nСамозанятый -  для подтверждения дохода предоставляет согласие на получение данных из ФНС.\n1. Если клиент зарегистрирован как самозанятый через ВТБ - дополнительные согласия не требуются\n2. Если клиент зарегистрирован как самозанятый в стороннем банке -предоставить согласия можно одним из способов:\n- в личном кабинете ВТБ Онлайн зайти в раздел «Бизнес и самозанятость» > «Самозанятость» > «Подтвердить права для ВТБ» > ввести СМС-код;\n- в приложении для самозанятых «Мой налог» перейти в раздел «Прочее» > «Партнеры» > выбрать «Банк ВТБ» > нажать «Разрешить»\nЛибо самозанятый может предоставить документ о доходах и трудоустройстве собственноручно, выгрузив из личного кабинета ИФНС в формате .pdf:\n- Справка о состоянии расчетов (доходов) по налогу на профессиональный доход (КНД1 122 036)\n- Справка о постановке на учет (снятии с учета) физического лица в качестве налогоплательщика налога на профессиональный доход (КНД 1 122 035)\n\n   ВТБ просит отправить выписку ПФР напрямую с Госуслуг на их почту:\n- Клиенту необходимо зайти в приложение Госуслуги \n- const norm=s=>String(s).toLowerCase().replace(/ё/g,'е');
const toks=q=>norm(q).split(/\s+/).filter(Boolean);
const hasQ=(txt,t)=>{const n=norm(txt);return t.every(w=>n.includes(w))};
const EMPTY=['','х','x'];
function filt(sec,st,ctx){
 const t=toks(st.q),B=st.banks,res={n:0,items:null,rows:null,cols:null,ign:false};
 if(sec.kind==='cards'){
  if(B.size&&!sec.banks.some(b=>B.has(b))) return res;
  res.items=sec.items.filter(i=>{
   if(i.t==='note') return !B.size&&t.length>0&&hasQ(i.x,t)||(!B.size&&!t.length&&ctx==='sec');
   if(B.size&&!i.b.some(b=>B.has(b))) return false;
   return !t.length||hasQ(i.s,t)}).map(i=>i.kb&&B.size?{...i,kv:i.kv.filter((_,k)=>i.kb[k].some(b=>B.has(b)))}:i);
  res.n=res.items.length;return res}
 let cols=sec.head.map((_,j)=>j);
 if(B.size){
  if(sec.bc) cols=cols.filter(j=>j<sec.lab||sec.bc[j].some(b=>B.has(b)));
  else if(sec.banks.length){ if(!sec.banks.some(b=>B.has(b))) return res }
  else if(ctx==='res') return res; else res.ign=true}
 const nb=sec.bc&&B.size?cols.filter(j=>j>=sec.lab):[];
 if(sec.bc&&B.size&&!nb.length) return res;
 if(!sec.head.length) cols=sec.rows[0]?sec.rows[0].c.map((_,j)=>j):[];
 res.cols=cols;
 res.rows=sec.rows.filter(r=>{
  if(r.sub) return true;
  if(t.length&&!hasQ(r.c.join(' ')+' '+sec.head.join(' '),t)) return false;
  if(nb.length&&!nb.some(j=>!EMPTY.includes(norm(r.c[j])))) return false;
  return true});
 res.n=res.rows.filter(r=>!r.sub).length;return res}

 return String(s).split(/(https?:\/\/\S+)/).map((p,i)=>i%2?`<a href="${esc(p)}" target="_blank" rel="noopener">открыть ссылку ↗</a>`:(re?p.split(re).map((x,k)=>k%2?'<mark>'+esc(x)+'</mark>':esc(x)).join(''):esc(p))).join('').replace(/\n/g,'<br>')}

function table(sec,r,lim){
 const rows=lim?r.rows.slice(0,lim):r.rows,cs=r.cols;
 const th=sec.head.length?`<thead><tr>${cs.map(j=>`<th>${hl(sec.head[j]||'')}</th>`).join('')}</tr></thead>`:'';
 const body=rows.map(x=>{const v=cs.map(j=>x.c[j]);const ne=v.filter(Boolean).length;
  if(ne===1&&v.length>3) return `<tr><td class="span" colspan="${v.length}">${hl(v.find(Boolean))}</td></tr>`;
  return `<tr class="${x.sub?'sub':''}">${v.map(c=>`<td class="${EMPTY.includes(norm(c))&&c?'x':''}">${c?hl(c):''}</td>`).join('')}</tr>`}).join('');
 return `<div class="tw"><table>${th}<tbody>${body}</tbody></table></div>`}
